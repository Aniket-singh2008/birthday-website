    <text x="500" y="240" font-family="'Patrick Hand', 'Fredoka', 'Comic Sans MS', cursive, sans-serif" font-weight="bold" font-size="54" fill="#1E1E1E" text-anchor="middle" letter-spacing="1">
      Hey, I made something
    </text>
    <text x="500" y="315" font-family="'Patrick Hand', 'Fredoka', 'Comic Sans MS', cursive, sans-serif" font-weight="bold" font-size="54" fill="#1E1E1E" text-anchor="middle" letter-spacing="1">
      for you. Do you wanna
    </text>
    <text x="500" y="390" font-family="'Patrick Hand', 'Fredoka', 'Comic Sans MS', cursive, sans-serif" font-weight="bold" font-size="54" fill="#1E1E1E" text-anchor="middle" letter-spacing="1">
      see it?
    </text>
  </g>

