      <line x1="368" y1="728" x2="378" y2="742" stroke="#E11D48" stroke-width="3" stroke-linecap="round" />
      <line x1="380" y1="728" x2="390" y2="742" stroke="#E11D48" stroke-width="3" stroke-linecap="round" />
      <line x1="392" y1="728" x2="402" y2="742" stroke="#E11D48" stroke-width="3" stroke-linecap="round" />

      <ellipse cx="560" cy="735" rx="20" ry="13" fill="#FB7185" opacity="0.8" />
      <line x1="550" y1="728" x2="560" y2="742" stroke="#E11D48" stroke-width="3" stroke-linecap="round" />
      <line x1="562" y1="728" x2="572" y2="742" stroke="#E11D48" stroke-width="3" stroke-linecap="round" />

