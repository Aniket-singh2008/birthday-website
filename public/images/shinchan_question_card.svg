  <line x1="68" y1="750" x2="94" y2="738" stroke="#1E1E1E" stroke-width="4.5" stroke-linecap="round" />
  <line x1="68" y1="790" x2="94" y2="778" stroke="#1E1E1E" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 68 895 C 68 910 82 924 96 924 C 82 924 68 938 68 952 C 68 938 54 924 40 924 C 54 924 68 910 68 895 Z" fill="#FBBF24" />

  <!-- Right Side Doodles beside center box -->
  <path d="M 932 605 C 932 620 946 634 960 634 C 946 634 932 648 932 662 C 932 648 918 634 904 634 C 918 634 932 620 932 605 Z" fill="#FBBF24" />
  <line x1="915" y1="705" x2="892" y2="738" stroke="#1E1E1E" stroke-width="4.5" stroke-linecap="round" />
  <line x1="945" y1="745" x2="922" y2="778" stroke="#1E1E1E" stroke-width="4.5" stroke-linecap="round" />
