    <ellipse cx="715" cy="1178" rx="14" ry="10" fill="#BA8759" stroke="#1E1E1E" stroke-width="4.2" />
    <ellipse cx="792" cy="1178" rx="14" ry="10" fill="#BA8759" stroke="#1E1E1E" stroke-width="4.2" />
