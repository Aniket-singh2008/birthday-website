<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06" />
    </filter>
    <filter id="stickerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background: Cozy warm cream/beige -->
  <rect width="1000" height="1500" fill="#FBF5EA" />

  <!-- ========================================== -->
  <!-- 1. AMBIENT DOODLES                         -->
  <!-- ========================================== -->

  <!-- Top-Left Sparkle Stars (✦) -->
  <path d="M 175 60 C 175 75 190 90 205 90 C 190 90 175 105 175 120 C 175 105 160 90 145 90 C 160 90 175 75 175 60 Z" fill="#FBBF24" />
  <path d="M 130 100 C 130 110 140 120 150 120 C 140 120 130 130 130 140 C 130 130 120 120 110 120 C 120 120 130 110 130 100 Z" fill="#FDE047" />
  <!-- Top-Left Hatch Marks -->
  <line x1="165" y1="145" x2="192" y2="160" stroke="#1E1E1E" stroke-width="4.5" stroke-linecap="round" />

  <!-- Top-Right Doodles -->
  <!-- Pink Heart Outline (♡) -->
  <path d="M 830 85 C 830 55, 795 45, 780 68 C 765 45, 730 55, 730 85 C 730 122, 780 150, 780 150 C 780 150, 830 122, 830 85 Z"
        fill="none" stroke="#FB7185" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" transform="rotate(15 780 90)" />
  <!-- Small Pink Filled Heart (♥) -->
  <path d="M 885 115 C 885 98, 868 90, 860 102 C 852 90, 835 98, 835 115 C 835 136, 860 152, 860 152 C 860 152, 885 136, 885 115 Z"
        fill="#FB7185" transform="rotate(25 860 120)" />
  <!-- Top-Right Hatch Marks -->
  <line x1="775" y1="170" x2="810" y2="182" stroke="#1E1E1E" stroke-width="4.5" stroke-linecap="round" />

  <!-- Left Side Doodles beside Big Heart -->
  <!-- Pink Heart Outline (♡) -->
  <path d="M 90 280 C 90 260, 68 250, 60 265 C 52 250, 30 260, 30 280 C 30 305, 60 325, 60 325 C 60 325, 90 305, 90 280 Z"
        fill="none" stroke="#FB7185" stroke-width="4.5" transform="rotate(-15 60 280)" />
  <!-- Hatch Marks (//) -->
  <line x1="28" y1="345" x2="55" y2="340" stroke="#1E1E1E" stroke-width="4.5" stroke-linecap="round" />
  <line x1="26" y1="375" x2="53" y2="370" stroke="#1E1E1E" stroke-width="4.5" stroke-linecap="round" />
  <!-- Sparkle Star (✦) -->
  <path d="M 70 495 C 70 512 85 526 100 526 C 85 526 70 540 70 556 C 70 540 55 526 40 526 C 55 526 70 512 70 495 Z" fill="#FDE047" />
  <!-- Hatch Marks (\ \) -->
  <line x1="125" y1="630" x2="148" y2="650" stroke="#1E1E1E" stroke-width="4.5" stroke-linecap="round" />
  <line x1="140" y1="655" x2="165" y2="675" stroke="#1E1E1E" stroke-width="4.5" stroke-linecap="round" />
  <!-- Lower Pink Heart (♥) -->
  <path d="M 85 675 C 85 655, 65 645, 56 660 C 48 645, 28 655, 28 675 C 28 700, 56 720, 56 720 C 56 720, 85 700, 85 675 Z"
        fill="none" stroke="#FB7185" stroke-width="4.5" transform="rotate(-10 56 680)" />

  <!-- Right Side Doodles beside Big Heart -->
  <!-- Sparkle Star (✦) -->
  <path d="M 945 370 C 945 385 958 396 972 396 C 958 396 945 408 945 422 C 945 408 932 396 918 396 C 932 396 945 385 945 370 Z" fill="#FDE047" />
  <!-- Hatch Marks (\\) -->
  <line x1="885" y1="430" x2="860" y2="445" stroke="#1E1E1E" stroke-width="4.5" stroke-linecap="round" />
  <line x1="888" y1="460" x2="863" y2="475" stroke="#1E1E1E" stroke-width="4.5" stroke-linecap="round" />
  <!-- Pink Heart Outline (♡) -->
  <path d="M 960 520 C 960 500, 938 490, 930 505 C 922 490, 900 500, 900 520 C 900 545, 930 565, 930 565 C 930 565, 960 545, 960 520 Z"
        fill="none" stroke="#FB7185" stroke-width="4.5" transform="rotate(15 930 520)" />
  <!-- Hatch Marks (\\) -->
  <line x1="835" y1="565" x2="855" y2="585" stroke="#1E1E1E" stroke-width="4.5" stroke-linecap="round" />
  <line x1="845" y1="590" x2="865" y2="610" stroke="#1E1E1E" stroke-width="4.5" stroke-linecap="round" />
  <!-- Sparkle Star (✦) -->
  <path d="M 930 610 C 930 624 942 634 954 634 C 942 634 930 646 930 658 C 930 646 918 634 906 634 C 918 634 930 624 930 610 Z" fill="#FDE047" />
  <!-- Hatch Marks -->
  <line x1="830" y1="675" x2="852" y2="700" stroke="#1E1E1E" stroke-width="4.5" stroke-linecap="round" />

  <!-- Doodles beside Banner -->
  <path d="M 98 875 C 98 855, 78 845, 70 860 C 62 845, 42 855, 42 875 C 42 900, 70 920, 70 920 C 70 920, 98 900, 98 875 Z"
        fill="none" stroke="#FB7185" stroke-width="4.5" transform="rotate(-15 70 880)" />
  <line x1="50" y1="940" x2="80" y2="935" stroke="#1E1E1E" stroke-width="4.5" stroke-linecap="round" />
  <line x1="48" y1="965" x2="78" y2="960" stroke="#1E1E1E" stroke-width="4.5" stroke-linecap="round" />

  <!-- ========================================== -->
  <!-- 2. TOP "CUTIE" STITCHED HEART              -->
  <!-- ========================================== -->
  <g filter="url(#softShadow)">
    <!-- Top Heart Outer Shape -->
    <path
      d="M 500 242
         C 500 242, 240 180, 240 85
         C 240 20, 345 -10, 425 22
         C 468 40, 500 78, 500 78
         C 500 78, 532 40, 575 22
         C 655 -10, 760 20, 760 85
         C 760 180, 500 242, 500 242 Z"
      fill="#FFD6E2"
      stroke="#1E1E1E"
      stroke-width="5.5"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    <!-- White Inner Dashed Stitch Line -->
    <path
      d="M 500 226
         C 500 226, 258 168, 258 85
         C 258 35, 348 10, 422 36
         C 462 52, 500 88, 500 88
         C 500 88, 538 52, 578 36
         C 652 10, 742 35, 742 85
         C 742 168, 500 226, 500 226 Z"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="4"
      stroke-dasharray="10 8"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Text: Cutie with heart on 'i' -->
    <text x="500" y="160" font-family="'Patrick Hand', 'Fredoka', 'Comic Sans MS', cursive, sans-serif" font-weight="bold" font-size="82" fill="#1E1E1E" text-anchor="middle" letter-spacing="2">
      Cutie
    </text>
    <!-- Tiny heart as dot on 'i' (x: 580, y: 88 approx) -->
    <path d="M 588 88 C 588 82, 580 78, 576 84 C 572 78, 564 82, 564 88 C 564 96, 576 104, 576 104 C 576 104, 588 96, 588 88 Z"
          fill="#1E1E1E" />
  </g>

  <!-- ========================================== -->
  <!-- 3. CENTER BIG STITCHED HEART FRAME         -->
  <!-- Blank Content / Media Area inside Heart!   -->
  <!-- ========================================== -->
  <g filter="url(#softShadow)">
    <!-- Outer Heart Background & Black Hand-drawn Border -->
    <path
      id="mainHeartOuter"
      d="M 500 295
         C 500 295, 350 225, 235 240
         C 125 255, 65 375, 75 490
         C 88 625, 250 780, 500 970
         C 750 780, 912 625, 925 490
         C 935 375, 875 255, 765 240
         C 650 225, 500 295, 500 295 Z"
      fill="#FFFFFF"
      stroke="#1E1E1E"
      stroke-width="5.5"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Inner Pink Dashed Stitched Line -->
    <path
      id="mainHeartStitch"
      d="M 500 325
         C 500 325, 360 258, 250 272
         C 152 286, 98 392, 106 492
         C 118 610, 268 755, 500 930
         C 732 755, 882 610, 894 492
         C 902 392, 848 286, 750 272
         C 640 258, 500 325, 500 325 Z"
      fill="none"
      stroke="#F472B6"
      stroke-width="4.5"
      stroke-dasharray="14 10"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
  </g>

  <!-- ========================================== -->
  <!-- 4. BANNER & SUNFLOWER STICKER              -->
  <!-- ========================================== -->
  <!-- Pink Banner "That is a good girl." -->
  <g filter="url(#softShadow)">
    <path
      d="M 100 1025
         Q 380 985 660 1010
         Q 680 1065 650 1100
         Q 370 1070 90 1105
         Q 75 1060 100 1025 Z"
      fill="#FFDCE5"
      stroke="#1E1E1E"
      stroke-width="5"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    <!-- Text: That is a good girl. -->
    <text x="365" y="1068" font-family="'Patrick Hand', 'Fredoka', 'Comic Sans MS', cursive, sans-serif" font-weight="bold" font-size="54" fill="#1E1E1E" text-anchor="middle" letter-spacing="1">
      That is a good girl.
    </text>
  </g>

  <!-- SUNFLOWER STICKER (Cute Die-Cut with White Border) -->
  <g filter="url(#stickerShadow)" transform="translate(825, 1055)">
    <!-- White Sticker Die-Cut Outline -->
    <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round">
      <circle cx="0" cy="0" r="105" />
      <path d="M -30 90 Q 0 145 35 125 Q 15 90 -30 90 Z" />
    </g>

    <!-- Stem & Leaves -->
    <path d="M 0 65 Q 10 110 5 140" fill="none" stroke="#22C55E" stroke-width="14" stroke-linecap="round" />
    <path d="M 0 65 Q 10 110 5 140" fill="none" stroke="#1E1E1E" stroke-width="4" stroke-linecap="round" />
    <!-- Left Leaf -->
    <path d="M -5 100 Q -45 90 -40 120 Q -5 125 -5 100 Z" fill="#4ADE80" stroke="#1E1E1E" stroke-width="3.5" />
    <!-- Right Leaf -->
    <path d="M 5 105 Q 45 95 40 125 Q 5 130 5 105 Z" fill="#4ADE80" stroke="#1E1E1E" stroke-width="3.5" />

    <!-- 14 Golden Yellow Sunflower Petals -->
    <g fill="#FBBF24" stroke="#1E1E1E" stroke-width="3.8" stroke-linejoin="round">
      <!-- Petal 1 -->
      <path d="M -15 -62 C -15 -90 15 -90 15 -62 Z" />
      <!-- Petal 2 -->
      <path d="M -15 -62 C -15 -90 15 -90 15 -62 Z" transform="rotate(25.7)" />
      <!-- Petal 3 -->
      <path d="M -15 -62 C -15 -90 15 -90 15 -62 Z" transform="rotate(51.4)" />
      <!-- Petal 4 -->
      <path d="M -15 -62 C -15 -90 15 -90 15 -62 Z" transform="rotate(77.1)" />
      <!-- Petal 5 -->
      <path d="M -15 -62 C -15 -90 15 -90 15 -62 Z" transform="rotate(102.8)" />
      <!-- Petal 6 -->
      <path d="M -15 -62 C -15 -90 15 -90 15 -62 Z" transform="rotate(128.5)" />
      <!-- Petal 7 -->
      <path d="M -15 -62 C -15 -90 15 -90 15 -62 Z" transform="rotate(154.2)" />
      <!-- Petal 8 -->
      <path d="M -15 -62 C -15 -90 15 -90 15 -62 Z" transform="rotate(180)" />
      <!-- Petal 9 -->
      <path d="M -15 -62 C -15 -90 15 -90 15 -62 Z" transform="rotate(205.7)" />
      <!-- Petal 10 -->
      <path d="M -15 -62 C -15 -90 15 -90 15 -62 Z" transform="rotate(231.4)" />
      <!-- Petal 11 -->
      <path d="M -15 -62 C -15 -90 15 -90 15 -62 Z" transform="rotate(257.1)" />
      <!-- Petal 12 -->
      <path d="M -15 -62 C -15 -90 15 -90 15 -62 Z" transform="rotate(282.8)" />
      <!-- Petal 13 -->
      <path d="M -15 -62 C -15 -90 15 -90 15 -62 Z" transform="rotate(308.5)" />
      <!-- Petal 14 -->
      <path d="M -15 -62 C -15 -90 15 -90 15 -62 Z" transform="rotate(334.2)" />
    </g>

    <!-- Brown Flower Center -->
    <circle cx="0" cy="0" r="50" fill="#92400E" stroke="#1E1E1E" stroke-width="4.5" />
    <circle cx="0" cy="0" r="44" fill="#A16207" />

    <!-- Cute Smiling Face on Sunflower -->
    <!-- Eyes (^ ^) -->
    <path d="M -22 -6 Q -15 -14 -8 -6" fill="none" stroke="#1E1E1E" stroke-width="4" stroke-linecap="round" />
    <path d="M 8 -6 Q 15 -14 22 -6" fill="none" stroke="#1E1E1E" stroke-width="4" stroke-linecap="round" />
    <!-- Cheeks (Blush) -->
    <ellipse cx="-24" cy="5" rx="7" ry="4" fill="#FB7185" />
    <ellipse cx="24" cy="5" rx="7" ry="4" fill="#FB7185" />
    <!-- Smiling Mouth -->
    <path d="M -7 6 Q 0 14 7 6" fill="none" stroke="#1E1E1E" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- ========================================== -->
  <!-- 5. BOTTOM "CLICK" STITCHED BUTTON          -->
  <!-- ========================================== -->
  <g id="clickButtonGroup">
    <!-- Radiating Sparkle Lines / Hatch Marks -->
    <line x1="205" y1="1265" x2="235" y2="1255" stroke="#1E1E1E" stroke-width="4.5" stroke-linecap="round" />
    <line x1="202" y1="1295" x2="232" y2="1285" stroke="#1E1E1E" stroke-width="4.5" stroke-linecap="round" />
    <line x1="755" y1="1255" x2="785" y2="1265" stroke="#1E1E1E" stroke-width="4.5" stroke-linecap="round" />
    <line x1="752" y1="1285" x2="782" y2="1295" stroke="#1E1E1E" stroke-width="4.5" stroke-linecap="round" />

    <!-- Little Hearts beside button -->
    <path d="M 185 1335 C 185 1318, 168 1310, 160 1322 C 152 1310, 135 1318, 135 1335 C 135 1356, 160 1372, 160 1372 C 160 1372, 185 1356, 185 1335 Z"
          fill="#FB7185" transform="rotate(-15 160 1335)" />
    <path d="M 850 1335 C 850 1318, 832 1310, 825 1322 C 818 1310, 800 1318, 800 1335 C 800 1356, 825 1372, 825 1372 C 825 1372, 850 1356, 850 1335 Z"
          fill="#FB7185" transform="rotate(15 825 1335)" />

    <!-- Main Yellow Button Body -->
    <rect
      x="275"
      y="1225"
      width="450"
      height="135"
      rx="67.5"
      ry="67.5"
      fill="#FEF08A"
      stroke="#1E1E1E"
      stroke-width="5.5"
    />
    <!-- Inner Gold Dashed Stitched Line -->
    <rect
      x="292"
      y="1242"
      width="416"
      height="101"
      rx="50.5"
      ry="50.5"
      fill="none"
      stroke="#F59E0B"
      stroke-width="3.5"
      stroke-dasharray="10 8"
    />
    <!-- Text: Click -->
    <text x="500" y="1316" font-family="'Patrick Hand', 'Fredoka', 'Comic Sans MS', cursive, sans-serif" font-weight="bold" font-size="76" fill="#1E1E1E" text-anchor="middle" letter-spacing="1">
      Click
    </text>
  </g>
</svg>
